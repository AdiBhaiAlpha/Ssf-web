@keyframes ssfLogoEntrance {
  0% {
    opacity: 0;
    transform: translateY(12px) scale(0.94);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes ssfLogoFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-3px);
  }
}

@keyframes ssfAmbientLight {
  0%, 100% {
    opacity: 0.55;
    transform: scale(0.96);
  }
  50% {
    opacity: 0.85;
    transform: scale(1.04);
  }
}

@keyframes ssfIndeterminateProgress {
  0% {
    left: 0%;
    width: 0%;
  }
  30% {
    left: 10%;
    width: 40%;
  }
  70% {
    left: 55%;
    width: 45%;
  }
  100% {
    left: 100%;
    width: 0%;
  }
}

@keyframes ssfDot1 {
  0%, 20% { opacity: 0; }
  35%, 100% { opacity: 1; }
}

@keyframes ssfDot2 {
  0%, 45% { opacity: 0; }
  60%, 100% { opacity: 1; }
}

@keyframes ssfDot3 {
  0%, 70% { opacity: 0; }
  85%, 100% { opacity: 1; }
}

@keyframes ssfTextFade {
  from {
    opacity: 0;
    transform: translateY(3px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.ssf-boot-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  background-color: #fafafa;
}

@media (prefers-color-scheme: dark) {
  .ssf-boot-container {
    background-color: #09090b;
  }
}

.dark .ssf-boot-container {
  background-color: #09090b;
}

.ssf-logo-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: ssfLogoEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.ssf-logo-floater {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: ssfLogoFloat 4.5s ease-in-out infinite 0.75s;
  will-change: transform;
}

.ssf-logo-ambient {
  position: absolute;
  border-radius: 9999px;
  background: radial-gradient(circle, rgba(225, 29, 72, 0.18) 0%, rgba(225, 29, 72, 0.05) 50%, transparent 70%);
  animation: ssfAmbientLight 3.8s ease-in-out infinite;
  pointer-events: none;
}

.ssf-logo-emblem {
  position: relative;
  border-radius: 9999px;
  overflow: hidden;
  box-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.1), 0 4px 12px -2px rgba(225, 29, 72, 0.12);
  border: 1.5px solid rgba(225, 29, 72, 0.25);
  background-color: #ffffff;
}

.dark .ssf-logo-emblem {
  box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.5), 0 4px 14px -2px rgba(225, 29, 72, 0.2);
  border: 1.5px solid rgba(225, 29, 72, 0.35);
  background-color: #18181b;
}

.ssf-progress-track {
  position: relative;
  width: 150px;
  height: 2.5px;
  border-radius: 9999px;
  background-color: rgba(225, 29, 72, 0.12);
  overflow: hidden;
}

.dark .ssf-progress-track {
  background-color: rgba(225, 29, 72, 0.2);
}

.ssf-progress-bar-active {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 9999px;
  background-color: #e11d48;
  animation: ssfIndeterminateProgress 1.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

.ssf-dot-1 {
  display: inline-block;
  animation: ssfDot1 1.6s infinite;
}
.ssf-dot-2 {
  display: inline-block;
  animation: ssfDot2 1.6s infinite;
}
.ssf-dot-3 {
  display: inline-block;
  animation: ssfDot3 1.6s infinite;
}

.ssf-status-text {
  animation: ssfTextFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@media (prefers-reduced-motion: reduce) {
  .ssf-logo-wrapper,
  .ssf-logo-floater,
  .ssf-logo-ambient,
  .ssf-status-text,
  .ssf-dot-1,
  .ssf-dot-2,
  .ssf-dot-3 {
    animation: none !important;
  }
}
