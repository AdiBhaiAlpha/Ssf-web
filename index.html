/* ==========================================================
   SPLIT SCREEN LAYOUT FOR PRESS RELEASE CREATOR
   ========================================================== */
.ssf-pr-split-layout {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.ssf-pr-form-column {
  flex: 1;
  min-width: 300px;
}

.ssf-pr-preview-column {
  flex: 1;
  min-width: 300px;
}

/* Mobile/Tablet: both columns visible as full width */
@media (max-width: 1024px) {
  .ssf-pr-form-column,
  .ssf-pr-preview-column {
    flex: 100%;
    min-width: 100%;
  }
}

/* Desktop: split layout */
@media (min-width: 1024px) {
  .ssf-pr-split-layout {
    flex-direction: row;
  }
  .ssf-pr-form-column {
    flex: 0 0 48%;
    border-right: 1px solid #e2e8f0;
    padding-right: 24px;
  }
  .ssf-pr-preview-column {
    flex: 0 0 48%;
    padding-left: 24px;
  }
  .ssf-pr-visible {
    display: block !important;
  }
  .ssf-pr-not-visible {
    display: none !important;
  }
}

.ssf-pr-tab {
  cursor: pointer;
  transition: all 0.2s;
}

.ssf-pr-tab.active {
  border-bottom: 2px solid #e11d48;
  color: #e11d48;
  padding-bottom: 8px;
}

.ssf-pr-tab:hover:not(.active) {
  color: #c90d15;
}

/* =========================================================
   PREMIUM INSTITUTIONAL GLOBAL LOADER & BOOT EXPERIENCE
   ========================================================= */
@keyframes ssfLogoEntrance {
  0% {
    opacity: 0;
    transform: translateY(12px) scale(0.94);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes ssfLogoFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-3px);
  }
}

@keyframes ssfAmbientLight {
  0%, 100% {
    opacity: 0.55;
    transform: scale(0.96);
  }
  50% {
    opacity: 0.85;
    transform: scale(1.04);
  }
}

@keyframes ssfIndeterminateProgress {
  0% {
    left: 0%;
    width: 0%;
  }
  30% {
    left: 10%;
    width: 40%;
  }
  70% {
    left: 55%;
    width: 45%;
  }
  100% {
    left: 100%;
    width: 0%;
  }
}

@keyframes ssfDot1 {
  0%, 20% { opacity: 0; }
  35%, 100% { opacity: 1; }
}

@keyframes ssfDot2 {
  0%, 45% { opacity: 0; }
  60%, 100% { opacity: 1; }
}

@keyframes ssfDot3 {
  0%, 70% { opacity: 0; }
  85%, 100% { opacity: 1; }
}

@keyframes ssfTextFade {
  from {
    opacity: 0;
    transform: translateY(3px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.ssf-boot-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  background-color: #fafafa;
}

@media (prefers-color-scheme: dark) {
  .ssf-boot-container {
    background-color: #09090b;
  }
}

.dark .ssf-boot-container {
  background-color: #09090b;
}

.ssf-logo-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: ssfLogoEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.ssf-logo-floater {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: ssfLogoFloat 4.5s ease-in-out infinite 0.75s;
  will-change: transform;
}

.ssf-logo-ambient {
  position: absolute;
  border-radius: 9999px;
  background: radial-gradient(circle, rgba(225, 29, 72, 0.18) 0%, rgba(225, 29, 72, 0.05) 50%, transparent 70%);
  animation: ssfAmbientLight 3.8s ease-in-out infinite;
  pointer-events: none;
}

.ssf-logo-emblem {
  position: relative;
  border-radius: 9999px;
  overflow: hidden;
  box-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.1), 0 4px 12px -2px rgba(225, 29, 72, 0.12);
  border: 1.5px solid rgba(225, 29, 72, 0.25);
  background-color: #ffffff;
}

.dark .ssf-logo-emblem {
  box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.5), 0 4px 14px -2px rgba(225, 29, 72, 0.2);
  border: 1.5px solid rgba(225, 29, 72, 0.35);
  background-color: #18181b;
}

.ssf-progress-track {
  position: relative;
  width: 150px;
  height: 2.5px;
  border-radius: 9999px;
  background-color: rgba(225, 29, 72, 0.12);
  overflow: hidden;
}

.dark .ssf-progress-track {
  background-color: rgba(225, 29, 72, 0.2);
}

.ssf-progress-bar-active {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 9999px;
  background-color: #e11d48;
  animation: ssfIndeterminateProgress 1.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

.ssf-dot-1 {
  display: inline-block;
  animation: ssfDot1 1.6s infinite;
}
.ssf-dot-2 {
  display: inline-block;
  animation: ssfDot2 1.6s infinite;
}
.ssf-dot-3 {
  display: inline-block;
  animation: ssfDot3 1.6s infinite;
}

.ssf-status-text {
  animation: ssfTextFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@media (prefers-reduced-motion: reduce) {
  .ssf-logo-wrapper,
  .ssf-logo-floater,
  .ssf-logo-ambient,
  .ssf-status-text,
  .ssf-dot-1,
  .ssf-dot-2,
  .ssf-dot-3 {
    animation: none !important;
  }
}

  <body>
    <div id="root">

      <div style="min-height: 100vh; background-color: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;">

    <!-- Clear cache button -->
    <div style="text-align: center; padding: 20px 0; background: transparent; margin-bottom: 20px;">
      <button onclick="localStorage.clear(); sessionStorage.clear(); caches.keys().then(function(names) { for (let name of names) caches.delete(name); }); window.location.reload(true);" style="background: transparent; color: #a1a1aa; border: 1px solid #e4e4e7; padding: 6px 12px; border-radius: 50px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: normal; transition: all 0.2s; font-family: sans-serif;" onmouseover="this.style.background='#f4f4f5'; this.style.color='#52525b'" onmouseout="this.style.background='transparent'; this.style.color='#a1a1aa'">

    <!-- ============================================================
         PHOTOCARD MAKER V2 WIDGET
         (responsive preview wrapper + export overlay + download btn)
         Displayed only on ?tab=photocard or standalone mode to prevent layout disruption on home/other tabs
         ============================================================ -->
    <div id="borbila-photocard-widget" style="display: none; max-width: 600px; margin: 24px auto; padding: 0 16px;">
      <div class="borbila-preview-wrapper" id="borbila-preview-wrapper">
        <div class="borbila-export-overlay" id="borbila-export-overlay">
          <div class="borbila-export-spinner"></div>
          <span>Generating photocard...</span>
        </div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap;">
        <button id="borbila-download-btn" class="borbila-photocard-front-button" style="flex: 1; min-width: 200px;">
          <svg class="borbila-photocard-front-button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span class="borbila-photocard-front-button-text">Download PhotoCard</span>
        </button>
      </div>
    </div>

    <script src="/borbila-v2-engine.js"></script>
    <script src="/community-chat.js" defer></script>
    <script type="module" src="/press_release_renderer.js" defer></script>
    <script>
      /* ============================================================
         PRESS RELEASE RENDERER FALLBACK
         (fixes missing press_release_creator.js import crash)
         ============================================================ */
      (function() {
        if (window.PressReleaseRenderer) return;
        console.warn('[PressRelease] press_release_creator.js not loaded — using stub fallback');
        var DEFAULT_DATA = { headline: '', body: '', date: '', committee: '', signature: '' };
        window.PressReleaseRenderer = {
          exportToPNG: function() { return Promise.reject(new Error('Press release creator not available')); },
          print: function() { window.print(); },
          toPlainText: function(data) { return (data && data.headline ? data.headline + '\n\n' : '') + (data && data.body || ''); },
          getDefaultData: function() { return Object.assign({}, DEFAULT_DATA); }
        };
      })();

      /* ============================================================
         PHOTOCARD MAKER V2 — STATE MANAGEMENT & LIVE SYNC
         (fixes: state sync lag, blob URL leaks, error feedback,
          responsive preview, file validation)
         ============================================================ */
      (function() {
        'use strict';

        var ENGINE = window.borbilaDrawClassicFormat ? window : null;
        var CARD_SIZE = window.borbilaCardSize || 1080;
        var ALLOWED_IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/svg+xml'];
        var MAX_IMAGE_SIZE_MB = 10;

        var state = {
          format: 'classic-red',
          photoImage: null,
          logoImage: null,
          photoBlobUrl: null,
          logoBlobUrl: null,
          payload: {
            title: '',
            centerText: '',
            dateText: '',
            siteName: '',
            domain: '',
            dateText: ''
          },
          settings: window.borbilaDefaultSettings ? Object.assign({}, window.borbilaDefaultSettings) : {}
        };

        /* ----------------------------------------------------------
           ERROR TOAST
           ---------------------------------------------------------- */
        var toastEl = null;
        var toastTimer = null;

        function showError(msg) {
          if (!toastEl) {
            toastEl = document.createElement('div');
            toastEl.className = 'borbila-error-toast';
            document.body.appendChild(toastEl);
          }
          toastEl.textContent = msg;
          toastEl.classList.add('is-visible');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function() {
            toastEl.classList.remove('is-visible');
          }, 5000);
        }

        /* ----------------------------------------------------------
           FILE VALIDATION
           ---------------------------------------------------------- */
        function validateFile(file) {
          if (!file) return 'No file selected';
          if (ALLOWED_IMAGE_TYPES.indexOf(file.type) === -1) {
            return 'Invalid file type "' + file.type + '". Allowed: JPEG, PNG, GIF, WebP, SVG.';
          }
          if (file.size > MAX_IMAGE_SIZE_MB * 1024 * 1024) {
            return 'File too large (' + (file.size / 1024 / 1024).toFixed(1) + 'MB). Max: ' + MAX_IMAGE_SIZE_MB + 'MB.';
          }
          return null;
        }

        /* ----------------------------------------------------------
           BLOB URL TRACKING (prevents memory leaks)
           ---------------------------------------------------------- */
        function revokeOldBlob(key) {
          if (state[key]) {
            try { URL.revokeObjectURL(state[key]); } catch(e) {}
            state[key] = null;
          }
        }

        function loadUserImage(file, imageKey, blobKey) {
          var error = validateFile(file);
          if (error) {
            showError(error);
            return Promise.reject(new Error(error));
          }

          revokeOldBlob(blobKey);
          var url = URL.createObjectURL(file);
          state[blobKey] = url;

          return new Promise(function(resolve, reject) {
            var img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
              state[imageKey] = img;
              resolve(img);
            };
            img.onerror = function() {
              revokeOldBlob(blobKey);
              state[imageKey] = null;
              var err = new Error('Failed to load uploaded image');
              showError(err.message);
              reject(err);
            };
            img.src = url;
          });
        }

        function loadImageUrl(url, imageKey) {
          if (!url || typeof url !== 'string' || !url.trim()) {
            state[imageKey] = null;
            return Promise.resolve(null);
          }
          url = url.trim();
          return new Promise(function(resolve) {
            var img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
              state[imageKey] = img;
              resolve(img);
            };
            img.onerror = function() {
              if (url.startsWith('http') && !url.includes('/api/proxy-image')) {
                var proxyImg = new Image();
                proxyImg.crossOrigin = 'anonymous';
                proxyImg.onload = function() {
                  state[imageKey] = proxyImg;
                  resolve(proxyImg);
                };
                proxyImg.onerror = function() {
                  state[imageKey] = null;
                  resolve(null);
                };
                proxyImg.src = '/api/proxy-image?url=' + encodeURIComponent(url);
              } else {
                state[imageKey] = null;
                resolve(null);
              }
            };
            img.src = url;
          });
        }

        /* ----------------------------------------------------------
           LIVE PREVIEW RENDERER
           ---------------------------------------------------------- */
        var previewCanvas = null;
        var rafId = null;

        function schedulePreview() {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(renderPreview);
        }

        function renderPreview() {
          rafId = null;
          if (!ENGINE) return;

          var wrapper = document.getElementById('borbila-preview-wrapper');
          if (!wrapper) return;

          if (!previewCanvas) {
            previewCanvas = document.createElement('canvas');
            previewCanvas.style.width = '100%';
            previewCanvas.style.height = 'auto';
            previewCanvas.style.borderRadius = '7px';
            previewCanvas.style.display = 'block';
            wrapper.innerHTML = '';
            wrapper.appendChild(previewCanvas);
          }

          var containerWidth = wrapper.clientWidth || 400;
          var displayW = Math.min(containerWidth, CARD_SIZE);
          var displayH = displayW;

          try {
            window.borbilaRenderPreview(
              state.format,
              state.photoImage,
              state.logoImage,
              state.payload,
              state.settings,
              previewCanvas,
              { displayWidth: displayW, displayHeight: displayH, size: CARD_SIZE }
            );
          } catch(e) {
            console.error('[Borbila V2] Preview error:', e);
            showError('Preview render failed: ' + e.message);
          }
        }

        /* ----------------------------------------------------------
           EXPORT WITH SPINNER + ERROR HANDLING
           ---------------------------------------------------------- */
        function handleExport() {
          if (!ENGINE) {
            showError('Photocard engine not loaded. Please refresh the page.');
            return;
          }

          var overlay = document.getElementById('borbila-export-overlay');
          var btn = document.getElementById('borbila-download-btn');

          if (overlay) overlay.classList.add('is-active');
          if (btn) btn.disabled = true;

          window.borbilaExportPhotocard(
            state.format,
            state.photoImage,
            state.logoImage,
            state.payload,
            state.settings,
            { size: CARD_SIZE, scale: 1 }
          ).then(function(result) {
            console.log('[Borbila V2] Exported:', result.filename);
          }).catch(function(err) {
            console.error('[Borbila V2] Export error:', err);
            showError('Export failed: ' + err.message);
          }).then(function() {
            if (overlay) overlay.classList.remove('is-active');
            if (btn) btn.disabled = false;
          });
        }

        /* ----------------------------------------------------------
           FORM INPUT BINDING (live sync)
           ---------------------------------------------------------- */
        function bindInput(id, stateKey, subKey) {
          var el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('input', function() {
            if (subKey) {
              state.payload[subKey] = el.value;
            } else {
              state.settings[stateKey] = el.value;
            }
            schedulePreview();
          });
        }

        function bindFileInput(id, imageKey, blobKey) {
          var el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('change', function() {
            var file = el.files && el.files[0];
            if (!file) return;
            loadUserImage(file, imageKey, blobKey).then(function() {
              schedulePreview();
            }).catch(function() {});
          });
        }

        /* ----------------------------------------------------------
           INITIALIZATION
           ---------------------------------------------------------- */
        function initPhotocard() {
          bindInput('bpc-title', 'title', 'title');
          bindInput('bpc-center-text', 'centerText', 'centerText');
          bindInput('bpc-date', 'dateText', 'dateText');
          bindInput('bpc-site-name', 'siteName', 'siteName');
          bindInput('bpc-primary-color', 'primaryColor');
          bindInput('bpc-secondary-color', 'secondaryColor');
          bindInput('bpc-accent-color', 'accentColor');
          bindInput('bpc-logo-url', 'logoUrl');
          bindFileInput('bpc-photo-upload', 'photoImage', 'photoBlobUrl');
          bindFileInput('bpc-logo-upload', 'logoImage', 'logoBlobUrl');

          var formatCards = document.querySelectorAll('.borbila-format-card input[name="borbila-format"]');
          for (var i = 0; i < formatCards.length; i++) {
            formatCards[i].addEventListener('change', function() {
              state.format = this.value;
              schedulePreview();
            });
          }

          var downloadBtn = document.getElementById('borbila-download-btn');
          if (downloadBtn) {
            downloadBtn.addEventListener('click', handleExport);
          }

          if (window.borbilaNormalizeSettings) {
            state.settings = window.borbilaNormalizeSettings(state.settings);
          }

          schedulePreview();
        }

        /* ----------------------------------------------------------
           CLEANUP ON PAGE UNLOAD (blob URL leak prevention)
           ---------------------------------------------------------- */
        window.addEventListener('beforeunload', function() {
          revokeOldBlob('photoBlobUrl');
          revokeOldBlob('logoBlobUrl');
          if (window.borbilaRevokeBlobUrls) window.borbilaRevokeBlobUrls();
        });

        /* ----------------------------------------------------------
           RESIZE HANDLER (responsive preview re-render)
           ---------------------------------------------------------- */
        var resizeTimer = null;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(schedulePreview, 150);
        });

        /* Auto-init when DOM ready */
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initPhotocard);
        } else {
          initPhotocard();
        }

        window.borbilaPhotocard = window.borbilaPhotocard || {};
        window.borbilaPhotocard.state = state;
        window.borbilaPhotocard.export = handleExport;
        window.borbilaPhotocard.schedulePreview = schedulePreview;
        window.borbilaPhotocard.loadUserImage = loadUserImage;
      })();

      /* Photocard Widget Tab Sync (avoids breaking layout on home page) */
      function syncPhotocardWidgetVisibility() {
        var widget = document.getElementById('borbila-photocard-widget');
        if (!widget) return;
        var search = window.location.search || '';
        var params = new URLSearchParams(search);
        var tab = params.get('tab');
        if (tab === 'photocard' || params.get('borbila') === '1') {
          widget.style.display = 'block';
        } else {
          widget.style.display = 'none';
        }
      }
      syncPhotocardWidgetVisibility();
      window.addEventListener('popstate', syncPhotocardWidgetVisibility);
      setInterval(syncPhotocardWidgetVisibility, 500);

      /* Global Image Error & Proxy Fallback Listener */
      window.addEventListener('error', function(event) {
        if (event.target && event.target.tagName === 'IMG') {
          var img = event.target;
          var originalSrc = img.getAttribute('data-original-src') || img.src;
          if (!img.getAttribute('data-has-fallback')) {
            img.setAttribute('data-has-fallback', '1');
            img.setAttribute('data-original-src', originalSrc);
            if (originalSrc && (originalSrc.startsWith('http://') || originalSrc.startsWith('https://')) && !originalSrc.includes('/api/proxy-image')) {
              img.crossOrigin = 'anonymous';
              img.src = '/api/proxy-image?url=' + encodeURIComponent(originalSrc);
              return;
            }
            if (originalSrc && !originalSrc.startsWith('/') && !originalSrc.startsWith('http') && !originalSrc.startsWith('data:') && !originalSrc.startsWith('blob:')) {
              img.src = '/' + originalSrc;
              return;
            }
            img.src = '/default-avatar.svg';
          } else if (img.src && !img.src.endsWith('/default-avatar.svg') && !img.src.endsWith('/default-avatar.png')) {
            img.src = '/default-avatar.svg';
          }
        }
      }, true);

      /* ============================================================
         PRESS RELEASE TAB SWITCHER (mobile/tablet tab toggle vs desktop split screen)
         ============================================================ */
      function showTab(tabName) {
        var formCol = document.getElementById('formColumn');
        var previewCol = document.getElementById('previewColumn');
        var tabs = document.querySelectorAll('.ssf-pr-tab');

        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.remove('active');
          tabs[i].style.color = '#64748b';
        }

        if (window.innerWidth < 1024) {
          if (tabName === 'form') {
            if (formCol) formCol.style.display = 'block';
            if (previewCol) previewCol.style.display = 'none';
          } else {
            if (formCol) formCol.style.display = 'none';
            if (previewCol) previewCol.style.display = 'block';
          }
        } else {
          if (formCol) formCol.style.display = 'block';
          if (previewCol) previewCol.style.display = 'block';
        }

        var activeTab = tabName === 'form'
          ? document.querySelector('.ssf-pr-tab[onclick*="form"]')
          : document.querySelector('.ssf-pr-tab[onclick*="preview"]');
        if (activeTab) {
          activeTab.classList.add('active');
          activeTab.style.color = '#e11d48';
        }
      }

      window.addEventListener('resize', function() {
        if (window.innerWidth >= 1024) {
          var formCol = document.getElementById('formColumn');
          var previewCol = document.getElementById('previewColumn');
          if (formCol) formCol.style.display = 'block';
          if (previewCol) previewCol.style.display = 'block';
        }
      });

      /* ============================================================
         REAL-TIME PRESS RELEASE SYNC (lightweight DOM polling)
         ============================================================ */
      document.addEventListener('input', function(e) {
        var previewDoc = document.querySelector('.ssf-pr-document');
        if (previewDoc && e.target.closest('.ssf-pr-form-column')) {
          previewDoc.style.opacity = '0.95';
          clearTimeout(previewDoc._syncTimer);
          previewDoc._syncTimer = setTimeout(function() {
            previewDoc.style.opacity = '1';
          }, 200);
        }
      });
    </script>
